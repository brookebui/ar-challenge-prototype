<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Place Couch</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      model-viewer {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #000;
        --poster-color: transparent;
        --progress-bar-color: transparent;
        --progress-mask: transparent;
      }

      /* Hide default 3D chrome; only the AR control should matter */
      model-viewer::part(default-ar-button) {
        display: none;
      }

      model-viewer::part(default-progress-bar) {
        display: none;
      }

      #place-btn {
        position: fixed;
        left: 50%;
        bottom: max(1.5rem, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 2;
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.95rem 1.75rem;
        min-height: 48px;
        min-width: 10rem;
        background: #fff;
        color: #000;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      }

      #place-btn[hidden],
      #unsupported[hidden] {
        display: none;
      }

      #unsupported {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
        background: #000;
        font-size: 1rem;
        line-height: 1.45;
        opacity: 0.9;
      }
    </style>
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
    ></script>
  </head>
  <body>
    <model-viewer
      id="couch"
      src="/models/couch.glb"
      alt="Couch"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-placement="floor"
      ar-scale="fixed"
      xr-environment
      shadow-intensity="1"
      exposure="1"
      touch-action="none"
      interaction-prompt="none"
    ></model-viewer>

    <button id="place-btn" type="button" hidden>Place couch</button>
    <p id="unsupported" hidden>Open on a phone with AR support</p>

    <script type="module">
      const viewer = document.getElementById('couch');
      const placeBtn = document.getElementById('place-btn');
      const unsupported = document.getElementById('unsupported');

      let triedAutoActivate = false;

      async function tryActivateAR() {
        if (!viewer.canActivateAR) {
          unsupported.hidden = false;
          placeBtn.hidden = true;
          return;
        }

        unsupported.hidden = true;
        placeBtn.hidden = false;

        try {
          await viewer.activateAR();
        } catch {
          // User dismissed or browser blocked auto-activate; keep the button.
        }
      }

      placeBtn.addEventListener('click', () => {
        viewer.activateAR();
      });

      viewer.addEventListener('load', () => {
        if (triedAutoActivate) return;
        triedAutoActivate = true;
        tryActivateAR();
      });

      // If AR capability resolves after load (common on mobile).
      const checkAr = () => {
        if (viewer.canActivateAR) {
          unsupported.hidden = true;
          placeBtn.hidden = false;
          if (!triedAutoActivate && viewer.loaded) {
            triedAutoActivate = true;
            tryActivateAR();
          }
        } else if (viewer.loaded) {
          // Give the browser a moment; then show unsupported if still no AR.
          setTimeout(() => {
            if (!viewer.canActivateAR) {
              unsupported.hidden = false;
              placeBtn.hidden = true;
            }
          }, 800);
        }
      };

      viewer.addEventListener('ar-status', checkAr);
      checkAr();
    </script>
  </body>
</html>

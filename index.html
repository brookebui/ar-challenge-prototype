<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Place Couch</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      model-viewer {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #000;
        --poster-color: transparent;
        --progress-bar-color: transparent;
        --progress-mask: transparent;
      }

      model-viewer::part(default-ar-button) {
        display: none;
      }

      model-viewer::part(default-progress-bar) {
        display: none;
      }

      #place-btn {
        position: fixed;
        left: 50%;
        bottom: max(1.5rem, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 2;
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.95rem 1.75rem;
        min-height: 48px;
        min-width: 10rem;
        background: #fff;
        color: #000;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      }

      #simulate-overlap,
      #rotate-btn {
        position: absolute;
        z-index: 2;
        appearance: none;
        display: none;
        place-items: center;
        width: 48px;
        height: 48px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        cursor: pointer;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
      }

      #simulate-overlap {
        top: max(1rem, env(safe-area-inset-top));
        right: max(1rem, env(safe-area-inset-right));
      }

      #rotate-btn {
        right: max(1rem, env(safe-area-inset-right));
        bottom: max(1.5rem, env(safe-area-inset-bottom));
      }

      #simulate-overlap svg,
      #rotate-btn svg {
        width: 22px;
        height: 22px;
        display: block;
      }

      #simulate-overlap[aria-pressed='true'] {
        border-color: #ff4d4d;
        color: #ff4d4d;
        background: rgba(80, 0, 0, 0.65);
      }

      /* Drag to rotate in AR while overlap is active. */
      #rotate-surface {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: none;
        touch-action: none;
        cursor: grab;
        pointer-events: none;
        background: transparent;
      }

      #rotate-surface.is-active {
        pointer-events: auto;
      }

      #rotate-surface:active {
        cursor: grabbing;
      }

      #overlap-msg {
        position: absolute;
        left: 50%;
        bottom: max(5.5rem, calc(env(safe-area-inset-bottom) + 4.5rem));
        transform: translateX(-50%);
        z-index: 2;
        display: none;
        margin: 0;
        padding: 0.65rem 1rem;
        max-width: min(90vw, 22rem);
        min-width: 12rem;
        text-align: center;
        font-size: 0.95rem;
        font-weight: 500;
        line-height: 1.35;
        color: #fff;
        background: rgba(180, 20, 20, 0.9);
        border-radius: 8px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s ease;
      }

      #overlap-msg.is-visible {
        opacity: 1;
      }

      #overlap-msg .msg-text {
        display: block;
        opacity: 1;
        transition: opacity 0.4s ease;
      }

      #overlap-msg .msg-text.is-fading {
        opacity: 0;
      }

      /* Prototype controls only in the live camera AR session (WebXR). */
      model-viewer[ar-status='session-started'] #simulate-overlap,
      model-viewer[ar-status='object-placed'] #simulate-overlap,
      model-viewer[ar-status='session-started'] #rotate-btn,
      model-viewer[ar-status='object-placed'] #rotate-btn {
        display: grid;
      }

      model-viewer[ar-status='session-started'] #rotate-surface,
      model-viewer[ar-status='object-placed'] #rotate-surface,
      model-viewer[ar-status='session-started'] #overlap-msg:not([hidden]),
      model-viewer[ar-status='object-placed'] #overlap-msg:not([hidden]) {
        display: block;
      }

      #place-btn[hidden],
      #unsupported[hidden],
      #overlap-msg[hidden] {
        display: none;
      }

      #unsupported {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
        background: #000;
        font-size: 1rem;
        line-height: 1.45;
        opacity: 0.9;
      }
    </style>
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
    ></script>
  </head>
  <body>
    <model-viewer
      id="couch"
      src="/models/couch.glb"
      alt="Couch"
      ar
      ar-modes="webxr"
      ar-placement="floor"
      ar-scale="fixed"
      xr-environment
      shadow-intensity="1"
      exposure="1"
      touch-action="none"
      interaction-prompt="none"
    >
      <div id="rotate-surface" aria-hidden="true"></div>
      <button
        id="simulate-overlap"
        type="button"
        aria-label="Simulate overlap"
        aria-pressed="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="7" width="11" height="11" rx="1.5" />
          <rect x="10" y="3" width="11" height="11" rx="1.5" />
        </svg>
      </button>
      <button id="rotate-btn" type="button" aria-label="Rotate couch">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-3-6.7" />
          <polyline points="21 3 21 9 15 9" />
        </svg>
      </button>
      <p id="overlap-msg" hidden>
        <span class="msg-text">It cannot be placed here.</span>
      </p>
    </model-viewer>

    <button id="place-btn" type="button" hidden>Place couch</button>
    <p id="unsupported" hidden>Open on a phone with AR support</p>

    <script type="module">
      const viewer = document.getElementById('couch');
      const placeBtn = document.getElementById('place-btn');
      const unsupported = document.getElementById('unsupported');
      const simulateBtn = document.getElementById('simulate-overlap');
      const rotateBtn = document.getElementById('rotate-btn');
      const rotateSurface = document.getElementById('rotate-surface');
      const overlapMsg = document.getElementById('overlap-msg');

      const OVERLAP_COLOR = [1, 0.12, 0.12, 1];
      const MSG_BLOCKED = 'It cannot be placed here.';
      const MSG_ROTATE = 'Try rotating.';
      const msgText = overlapMsg.querySelector('.msg-text');

      let originalColors = [];
      let overlapping = false;
      let triedAutoActivate = false;
      let messageTimers = [];
      let yawDeg = 0;

      const TAP_ROTATE_DEG = 45;
      const DRAG_SENSITIVITY = 0.45;
      const TAP_MOVE_THRESHOLD = 8;

      let pointerId = null;
      let lastPointerX = 0;
      let totalDragX = 0;

      function clearMessageTimers() {
        messageTimers.forEach(clearTimeout);
        messageTimers = [];
      }

      function applyYaw() {
        viewer.orientation = `0deg ${yawDeg}deg 0deg`;
      }

      function rotateBy(deltaDeg) {
        yawDeg = ((yawDeg + deltaDeg) % 360 + 360) % 360;
        applyYaw();
        if (overlapping) setOverlap(false);
      }

      function cacheOriginalColors() {
        const materials = viewer.model?.materials ?? [];
        originalColors = materials.map((material) =>
          material.pbrMetallicRoughness.baseColorFactor.slice()
        );
      }

      function showBlockedThenRotate() {
        clearMessageTimers();
        msgText.textContent = MSG_BLOCKED;
        msgText.classList.remove('is-fading');
        overlapMsg.hidden = false;
        void overlapMsg.offsetWidth;
        overlapMsg.classList.add('is-visible');

        messageTimers.push(
          setTimeout(() => {
            if (!overlapping) return;
            msgText.classList.add('is-fading');
            messageTimers.push(
              setTimeout(() => {
                if (!overlapping) return;
                msgText.textContent = MSG_ROTATE;
                msgText.classList.remove('is-fading');
              }, 400)
            );
          }, 1400)
        );
      }

      function hideOverlapMessage() {
        clearMessageTimers();
        overlapMsg.classList.remove('is-visible');
        msgText.classList.add('is-fading');
        messageTimers.push(
          setTimeout(() => {
            overlapMsg.hidden = true;
            msgText.textContent = MSG_BLOCKED;
            msgText.classList.remove('is-fading');
          }, 350)
        );
      }

      function setOverlap(active) {
        overlapping = active;
        simulateBtn.setAttribute('aria-pressed', String(active));
        rotateSurface.classList.toggle('is-active', active);

        if (active) {
          showBlockedThenRotate();
        } else {
          hideOverlapMessage();
        }

        const materials = viewer.model?.materials ?? [];
        materials.forEach((material, i) => {
          const color = active
            ? OVERLAP_COLOR
            : (originalColors[i] ?? [1, 1, 1, 1]);
          material.pbrMetallicRoughness.setBaseColorFactor(color);
        });
      }

      simulateBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        if (!viewer.model?.materials?.length) return;
        if (!originalColors.length) cacheOriginalColors();
        setOverlap(!overlapping);
      });

      rotateBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        rotateBy(TAP_ROTATE_DEG);
      });

      function stopControlPointer(event) {
        event.stopPropagation();
      }

      simulateBtn.addEventListener('pointerdown', stopControlPointer);
      rotateBtn.addEventListener('pointerdown', stopControlPointer);

      rotateSurface.addEventListener('pointerdown', (event) => {
        if (event.button !== undefined && event.button !== 0) return;
        pointerId = event.pointerId;
        lastPointerX = event.clientX;
        totalDragX = 0;
        rotateSurface.setPointerCapture(event.pointerId);
      });

      rotateSurface.addEventListener('pointermove', (event) => {
        if (pointerId !== event.pointerId) return;
        const dx = event.clientX - lastPointerX;
        lastPointerX = event.clientX;
        totalDragX += dx;
        if (Math.abs(dx) < 0.5) return;
        rotateBy(dx * DRAG_SENSITIVITY);
      });

      function endRotatePointer(event) {
        if (pointerId !== event.pointerId) return;
        const wasTap = Math.abs(totalDragX) < TAP_MOVE_THRESHOLD;
        pointerId = null;
        if (wasTap) {
          rotateBy(TAP_ROTATE_DEG);
        }
      }

      rotateSurface.addEventListener('pointerup', endRotatePointer);
      rotateSurface.addEventListener('pointercancel', endRotatePointer);

      async function tryActivateAR() {
        if (!viewer.canActivateAR) {
          unsupported.hidden = false;
          placeBtn.hidden = true;
          return;
        }

        unsupported.hidden = true;
        placeBtn.hidden = false;

        try {
          await viewer.activateAR();
        } catch {
          // User dismissed or browser blocked auto-activate; keep the button.
        }
      }

      placeBtn.addEventListener('click', () => {
        viewer.activateAR();
      });

      viewer.addEventListener('load', () => {
        cacheOriginalColors();
        if (overlapping) setOverlap(true);

        if (triedAutoActivate) return;
        triedAutoActivate = true;
        tryActivateAR();
      });

      const checkAr = (event) => {
        const status = event?.detail?.status ?? viewer.getAttribute('ar-status');
        const inAr =
          status === 'session-started' || status === 'object-placed';

        if (inAr) {
          unsupported.hidden = true;
          placeBtn.hidden = true;
          return;
        }

        // Left AR (or never entered): keep prototype UI out of the 3D preview.
        if (overlapping) setOverlap(false);

        if (viewer.canActivateAR) {
          unsupported.hidden = true;
          placeBtn.hidden = false;
          if (!triedAutoActivate && viewer.loaded) {
            triedAutoActivate = true;
            tryActivateAR();
          }
        } else if (viewer.loaded) {
          setTimeout(() => {
            if (!viewer.canActivateAR) {
              unsupported.hidden = false;
              placeBtn.hidden = true;
            }
          }, 800);
        }
      };

      viewer.addEventListener('ar-status', checkAr);
      checkAr();
    </script>
  </body>
</html>
